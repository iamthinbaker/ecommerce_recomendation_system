services:
  web:
    build: .
    depends_on:
      mydb:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "5678:5678"
    environment:
      - HOST=mydb
      - USER=odoo
      - PASSWORD=myodoo
    volumes:
      - ./addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
      - odoo-filestore:/var/lib/odoo
    entrypoint: ["/bin/bash", "-c"]
    command: ["odoo --stop-after-init -i bookstore_recommendation && exec python3 -m debugpy --listen 0.0.0.0:5678 $(which odoo) --workers=0"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  mydb:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=myodoo
      - POSTGRES_USER=odoo
    volumes: []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odoo-filestore: