[project]
name = "bookstore-recommendation"
version = "0.1.0"
description = "Sistema de recomendación de librería sobre Odoo 19"
requires-python = ">=3.12"

# Dependencias de runtime (modelo ML dentro de Odoo)
dependencies = [
    "scikit-learn",
    "pandas",
    "numpy",
    "joblib",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "debugpy",
]
# Dependencias adicionales para los scripts de generación y población de datos
scripts = [
    "faker[es_ES]",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
